name: rojeta_doctor
description: "A new Flutter project."
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  awesome_notifications: ^0.12.1
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.8
  file_picker: ^11.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  pinput: ^6.0.2
  recase: ^4.1.0

dev_dependencies:
  build_runner: ^2.4.13

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: false
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 10
  adaptive_icon_foreground: "assets/images/logo_app_icon.jpg"
  image_path: "assets/images/logo_app_icon.jpg"
  min_sdk_android: 21
