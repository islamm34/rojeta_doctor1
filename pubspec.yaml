name: rojeta_doctor
description: "A new Flutter project."
publish_to: 'none' 

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.8
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  dio: ^5.9.2
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.3.1
  recase: ^4.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  pinput: ^6.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: false
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 10
  adaptive_icon_foreground: "assets/images/logo_app_icon.jpg"
  image_path: "assets/images/logo_app_icon.jpg"
  min_sdk_android: 21